<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BusinessFlow | {% block titulo %}{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="container">

        <!-- MENU LATERAL -->
        <aside class="sidebar">

            <div class="logo">
                <h2>Business<span>Flow</span></h2>
            </div>

            <nav>
                <a href="/" class="{{ 'active' if request.path == '/' else '' }}">🏠 Dashboard</a>
                <a href="/vendas" class="{{ 'active' if request.path == '/vendas' else '' }}">💰 Vendas</a>
                <a href="/produtos" class="{{ 'active' if request.path == '/produtos' else '' }}">📦 Produtos</a>
                <a href="/clientes" class="{{ 'active' if request.path == '/clientes' else '' }}">👥 Clientes</a>
                <a href="/relatorios" class="{{ 'active' if request.path == '/relatorios' else '' }}">📊 Relatórios</a>
            </nav>

        </aside>


        <!-- CONTEÚDO PRINCIPAL -->
        <main class="main-content">

            <!-- CABEÇALHO -->
            <header class="header">

                <div>
                    {% block cabecalho %}{% endblock %}
                </div>

                <div class="header-acoes">
                    {% block botoes %}{% endblock %}
                    <button class="btn-venda" id="abrirModal">
                        + Nova venda
                    </button>
                </div>

            </header>

            {% block conteudo %}{% endblock %}

        </main>

    </div>


    <!-- MODAL DE NOVA VENDA (compartilhado entre as páginas) -->
    <div class="modal" id="modalVenda">
        <div class="modal-content">

            <div class="modal-header">
                <h2>Nova venda</h2>
                <button type="button" class="fechar-modal" id="fecharModal" aria-label="Fechar">&times;</button>
            </div>

            <form id="formVenda">

                <div class="form-group">
                    <label for="produto">Produto</label>
                    <input type="text" id="produto" list="listaProdutos" autocomplete="off" placeholder="Ex.: Tênis Nike" required>
                    <datalist id="listaProdutos"></datalist>
                </div>

                <div class="form-group">
                    <label for="valor">Valor unitário (R$)</label>
                    <input type="number" id="valor" min="0.01" step="0.01" placeholder="0,00" required>
                </div>

                <div class="form-group">
                    <label for="quantidade">Quantidade</label>
                    <input type="number" id="quantidade" min="1" step="1" placeholder="1" required>
                </div>

                <div class="form-group">
                    <label for="clienteVenda">Cliente (opcional)</label>
                    <select id="clienteVenda">
                        <option value="">Sem cliente</option>
                    </select>
                </div>

                <button type="submit" class="btn-confirmar">Confirmar venda</button>

            </form>

        </div>
    </div>

    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    {% block scripts %}{% endblock %}

</body>
</html>
